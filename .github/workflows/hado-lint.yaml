name: hadolint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  HADOLINT_SARIF_FILE: "hadolint-results.sarif"

jobs:
  lint:
    name: Hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write  # Required to upload SARIF files to Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: "warning"
          output-file: "${{ env.HADOLINT_SARIF_FILE }}"
          format: "sarif"
          verbose: true
      - name: upload hadolint results
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: "${{ env.HADOLINT_SARIF_FILE }}"
