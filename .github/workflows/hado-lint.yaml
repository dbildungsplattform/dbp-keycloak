name: hadolint
on:
  push:
    branches:
      - "**"

env:
  HADOLINT_SARIF_FILE: "hadolint-results.sarif"

jobs:
  lint:
    name: Hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write  # Required to upload SARIF files to Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: "warning"
          output-file: "${{ env.HADOLINT_SARIF_FILE }}"
          format: "sarif"
          verbose: true
      - name: upload hadolint results
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: "${{ env.HADOLINT_SARIF_FILE }}"
