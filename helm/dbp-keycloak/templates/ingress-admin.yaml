{{- if .Values.ingress.admin.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common.names.fullname" . }}-admin
  namespace: {{ include "common.names.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.admin.allowedIPs }}
    traefik.ingress.kubernetes.io/router.middlewares: >-
      {{ include "common.names.namespace" . }}-{{ include "common.names.fullname" . }}-ipallowlist@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
    {{- end }}
    {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - "{{ .Values.keycloak.hostname }}"
      {{- if .Values.ingress.tls.secretName }}
      secretName: "{{ .Values.ingress.tls.secretName }}"
      {{- end }}
  {{- end }}
  ingressClassName: "{{ .Values.ingress.ingressClassName }}"
  rules:
    - host: "{{ .Values.keycloak.hostname }}"
      http:
        paths:
          - path: "{{ $.Values.keycloak.httpRelativePath }}/admin"
            pathType: "Prefix"
            backend:
              service:
                name: "{{ include "common.names.fullname" $ }}"
                port:
                  name: "http"
{{- end }}
