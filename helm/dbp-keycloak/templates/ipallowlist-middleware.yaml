
{{- if and .Values.ingress.admin.enabled .Values.ingress.traefik }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "common.names.fullname" . }}-ipallowlist
  namespace: {{ include "common.names.namespace" . }}
spec:
  ipAllowList:
    sourceRange:
      {{ range .Values.ingress.admin.allowedIPs -}}
            - {{- . | nindent 12 }}
      {{ end }}
{{- end }}
